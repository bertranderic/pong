name: Build and Release Windows

on:
  push:
    tags:
      - 'v*' # S'exécute quand vous poussez un tag comme v1.0, v1.0.0, etc.

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Créer l'exécutable Windows avec PyInstaller
        run: |
          pyinstaller --onefile --noconsole --icon "pong.ico" --add-data "assets;assets" pong.py

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pong.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}